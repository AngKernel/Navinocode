name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run test:unit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run build:extension
      - run: npm run validate:extension
      - name: Prepare isolated QA workspace
        run: tar --exclude='./.git' --exclude='./.env*' --exclude='./public/fonts' --exclude='./build' --exclude='./extension' -czf /tmp/navinocode-qa.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: navinocode-qa
          path: /tmp/navinocode-qa.tar.gz
          retention-days: 1
