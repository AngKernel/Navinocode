name: P0 P1 isolated verification
on:
  push:
    branches: [work/p0p1-20260920]
permissions:
  contents: write
concurrency:
  group: navinocode-p0p1-20260920
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'AngKernel/Navinocode' && github.ref == 'refs/heads/work/p0p1-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHAT_VARIABLE: ''
      PUBLIC_PATH: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Reconstruct verified text changes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, lzma
          from pathlib import Path, PurePosixPath
          files = sorted(Path('.integration').glob('part-*.xz'))
          assert len(files) == 5
          compressed = b''.join(p.read_bytes() for p in files)
          assert hashlib.sha256(compressed).hexdigest() == 'dda6a775cdf57807b52c6ccc2cbbbe0321cd5deae8b4f0127ce0815f351a2f19'
          payload = json.loads(lzma.decompress(compressed))
          assert len(payload) == 19
          for name, text in payload.items():
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name == '.integration/apply.py' or path.parts[0] in ('src', 'tests', 'scripts', 'docs')
              target = Path(name)
              assert not target.is_symlink() and isinstance(text, str)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')
          print('Reconstructed', len(payload), 'verified text files')
          PY
          if [ -f .integration/preflight.py ]; then python .integration/preflight.py; fi
          python .integration/apply.py
          if [ -f .integration/fixes.py ]; then python .integration/fixes.py; fi
      - name: Node regression tests
        shell: bash
        run: |
          mkdir -p qa-output
          set -o pipefail
          npm run test:unit 2>&1 | tee qa-output/unit.log
      - name: Install existing application dependencies
        run: npm install --no-audit --no-fund
      - name: Web and extension builds
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee qa-output/web-build.log
          npm run build:extension 2>&1 | tee qa-output/extension-build.log
          npm run validate:extension 2>&1 | tee qa-output/extension-validation.log
      - name: Record existing lint baseline
        shell: bash
        run: |
          set +e
          npm run lint > qa-output/lint.log 2>&1
          code=$?
          echo "Lint exit code: $code (recorded separately, not a passing lint claim)"
          cat qa-output/lint.log
          exit 0
      - name: Chromium production DOM tests
        shell: bash
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          set -o pipefail
          python scripts/smoke-p0p1.py 2>&1 | tee qa-output/browser.log
      - name: Create clean tested result commit
        shell: bash
        run: |
          base=0a8597d0fedee08bf3c110fa54b14899713f3537
          rm -rf .integration
          rm .github/workflows/p0p1-qa.yml
          git add src tests scripts/smoke-p0p1.py docs/p0-p1-2026-09-20.md public/manifest.json README.md PRIVACY.md
          git add -u .integration .github/workflows/p0p1-qa.yml
          git diff --cached --check
          tree=$(git write-tree)
          git diff-tree --no-commit-id --name-only -r "${base}^{tree}" "$tree" > qa-output/changed-files.txt
          if grep -E '(^\.integration/|p0p1-qa\.yml|node_modules|package-lock|^build/|^extension/|^public/fonts/)' qa-output/changed-files.txt; then
            echo 'Unexpected generated or temporary changes'; exit 1
          fi
          export GIT_AUTHOR_NAME=AngKernel GIT_COMMITTER_NAME=AngKernel
          export GIT_AUTHOR_EMAIL=38496970+AngKernel@users.noreply.github.com
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit=$(git commit-tree "$tree" -p "$base" -m 'feat: add sync diagnostics, recovery history, browser sessions and bulk organization' -m 'Complete the four requested P0/P1 features on the unified workspace store. Add preflight difference previews, bounded local recovery history, opt-in local tab sessions and atomic cross-workspace/import actions with regression coverage. No main merge, release or Supabase schema changes.')
          result=refs/heads/work/p0p1-result-20260920
          if [ -n "$(git ls-remote --heads origin "$result")" ]; then
            echo 'Result branch already exists; refusing to overwrite'; exit 1
          fi
          git push origin "$commit:$result"
          printf '%s\n' "$commit" | tee qa-output/result-commit.txt
          echo "Clean result commit: $commit" >> "$GITHUB_STEP_SUMMARY"
          cat qa-output/changed-files.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0p1-verification-${{ github.run_number }}
          path: qa-output/
          if-no-files-found: ignore
          retention-days: 7
