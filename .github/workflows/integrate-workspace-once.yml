name: Verify workspace integration once

on:
  push:
    branches: [refactor/unified-workspace-library]
    paths: [.integration/ready]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'AngKernel/Navinocode' && github.ref == 'refs/heads/refactor/unified-workspace-library'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Apply hash-verified source edits
        run: python3 .integration/apply.py apply
      - run: npm install --no-audit --no-fund
      - run: npm run test:unit
      - run: npm run build
      - run: npm run build:extension
      - run: npm run validate:extension
      - run: git diff --check
      - name: Prepare verified Git objects without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .integration/apply.py prepare-tree
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-integration-result
          path: /tmp/workspace-integration-result.json
          retention-days: 1
